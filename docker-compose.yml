services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: field_core_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: seacom_experimental_db
    ports:
      - "5433:5432"
    volumes:
      - seacom_db_data:/var/lib/postgresql/data
      - ./scripts/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seacom_experimental_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: field_core_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - seacom_redis_data:/data

  backend:
    build: .
    container_name: field_core_backend
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_NAME: seacom_experimental_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # Celery worker — processes the notification/email/webhook queue (L2)
  worker:
    build: .
    container_name: field_core_worker
    command: uv run celery -A app.core.celery_app.celery_app worker --loglevel=info
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_NAME: seacom_experimental_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # Frontend lives in a sibling repo. Decoupled from the default stack — run with:
  #   docker compose --profile frontend up
  # (set FRONTEND_PATH or adjust the build context to your checkout).
  frontend:
    build: ${FRONTEND_PATH:-../FieldCore-frontend}
    container_name: field_core_frontend
    profiles: ["frontend"]
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  seacom_db_data:
    driver: local
  seacom_redis_data:
    driver: local
