[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "field-core-backend"
version = "1.1.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "loguru>=0.7.3",
    "passlib[argon2]>=1.7.4",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.12.0",
    "python-jose>=3.5.0",
    "sqlmodel>=0.0.31",
    "slowapi>=0.1.9",
    "reportlab>=4.0.0",
    "pillow>=10.0.0",
    "geoalchemy2>=0.14.0",
    "shapely>=2.0.0",
    "httpx>=0.27.0",
    "strawberry-graphql[fastapi]>=0.235.0",
    "redis>=4.5.0",
    "tzdata>=2024.1",
    "aiosmtplib>=3.0.0",
    "webauthn>=2.7.1",
    "apscheduler>=3.10,<4",
    "celery[redis]>=5.3,<6",
    "psutil>=6.0.0",
    "supabase>=2.31.0",
    "alembic>=1.18.5",
]

[dependency-groups]
dev = [
    "pdfplumber>=0.11.9",
    "pytest>=8.4.2",
    "ruff>=0.15.17",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Accessing argon2\\.__version__ is deprecated.*:DeprecationWarning:passlib\\.handlers\\.argon2",
]
